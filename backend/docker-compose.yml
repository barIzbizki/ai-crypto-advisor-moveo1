services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moveo1
    ports:
      # Host port 5434 - avoids colliding with other local Postgres instances
      # already running on 5432/5433.
      - "5434:5432"
    volumes:
      - moveo1-postgres-data:/var/lib/postgresql/data

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  moveo1-postgres-data:
